[project]
name = "llmkit"
version = "0.1.0"
description = "The one seam every ~/dev project calls LLMs through: normalised usage, cost, per-project attribution."
requires-python = ">=3.12"
dependencies = []  # core is stdlib-only so it drops into any project and any Lambda image

[project.optional-dependencies]
openai = ["openai>=1.40"]   # LLM.chat() for OpenAI-compatible providers (DeepSeek, OpenAI)

[project.scripts]
llmkit = "llmkit.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["llmkit"]

[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true
